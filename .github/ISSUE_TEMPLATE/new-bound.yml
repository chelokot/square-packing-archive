name: New or improved bound
description: Propose a result or submit a Lean-checked result for the catalog.
title: "[bound] s(n) relation value"
labels: ["bound submission"]
body:
  - type: markdown
    attributes:
      value: |
        Unformalized results belong in issues. Catalog additions require a linked
        Lean theorem for the exact count, bound, and relation, plus passing CI.
        This also applies to inactive historical records. Preserve primary
        sources, original coordinates, and every contributor's attribution.
  - type: input
    id: claim
    attributes:
      label: Claim
      description: State the exact relation, for example s(68) ≤ 8.80339.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Authors and provenance
      description: List discoverers, optimizers, provers, dates, and primary links.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Configuration or proof artifacts
      description: Link original coordinates, source code, paper, and certificates. Explain any rounding or reconstruction.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Strongest evidence
      options:
        - Reported configuration
        - Computational certificate
        - Published proof awaiting Lean (issue only)
        - Lean theorem ready for catalog review
    validations:
      required: true
  - type: textarea
    id: lean-proof
    attributes:
      label: Lean theorem and CI
      description: Required for catalog review; optional for pending proposals. Link the Lean file, give the fully qualified theorem name and exact statement, and link passing CI that checks it against the catalog claim.
  - type: checkboxes
    id: attribution
    attributes:
      label: Attribution
      options:
        - label: I have credited every known discoverer, optimizer, and prover.
          required: true

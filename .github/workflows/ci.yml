name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun run archive:build
      - name: Check README matrix is up to date
        run: git diff --exit-code -- docs/assets/coverage.svg
      - run: bun run check
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run format:check
      - run: bun run build

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v7
      - run: python3 ../scripts/generate-lean-evidence-audit.py --check
      - run: python3 ../scripts/check-nagamochi-counterexample.py --check-figure
      - name: Check generated geometric covers
        working-directory: .
        run: |
          python3 -S -m unittest discover -s scripts -p 'test_triangle_cover.py'
          python3 -S scripts/generate-triangle-cover.py --check
          python3 -S scripts/generate-triangle-cover.py --step 2 --full --check
          python3 -S scripts/generate-triangle-cover.py --step 3 --full --check
          python3 -S scripts/generate-triangle-cover.py --step 4 --full --check
      - name: Check exact search experiments
        working-directory: experiments/near-square-search
        run: |
          python3 -S -m unittest -v test_exact_geometry test_row_compensation
          python3 -S check_results.py results-7.9999.jsonl
          python3 -S check_results.py results-7.999999.jsonl
      - name: Check resource and compensation experiments
        working-directory: .
        run: |
          python3 -S -m unittest discover -s experiments/resource-repair -p 'test_*.py'
          python3 -S experiments/resource-repair/verify_repairs.py
          python3 -S -m unittest discover -s experiments/boundary-compensation -p 'test_*.py'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
      - name: Reject unfinished proofs
        run: |
          if grep -R --line-number --word-regexp sorry SquarePackingArchive SquarePackingArchive.lean; then
            exit 1
          fi

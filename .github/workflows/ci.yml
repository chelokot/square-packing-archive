name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [archive-and-web, lean]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  archive-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun run archive:build
      - name: Check README matrix is up to date
        run: git diff --exit-code -- docs/assets/coverage.svg
      - run: bun run check
      - run: bun run test
      - run: bun test scripts/generate-quadratic-certificates.test.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run format:check
      - run: bun run build

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v7
      - run: python3 ../scripts/generate-lean-evidence-audit.py --check
      - run: python3 -S -m unittest discover -s ../scripts -p 'test_lean_evidence_audit.py'
      - run: python3 ../scripts/check-nagamochi-counterexample.py --check-figure
      - name: Check generated geometric covers
        working-directory: .
        run: |
          python3 -S -m unittest discover -s scripts -p 'test_triangle_cover.py'
          python3 -S -m unittest discover -s scripts -p 'test_nonadjacent_cover.py'
          python3 -S -m unittest discover -s scripts -p 'test_bentz_adjacent_cover.py'
          python3 -S scripts/generate-triangle-cover.py --check
          python3 -S scripts/generate-triangle-cover.py --step 2 --full --check
          python3 -S scripts/generate-triangle-cover.py --step 3 --full --check
          python3 -S scripts/generate-triangle-cover.py --step 4 --full --check
      - name: Check exact search experiments
        working-directory: experiments/near-square-search
        run: |
          python3 -S -m unittest -v test_exact_geometry test_row_compensation
          python3 -S check_results.py results-7.9999.jsonl
          python3 -S check_results.py results-7.999999.jsonl
      - name: Check resource and compensation experiments
        working-directory: .
        run: |
          python3 -S -m unittest discover -s experiments/resource-repair -p 'test_*.py'
          python3 -S experiments/resource-repair/verify_repairs.py
          python3 -S -m unittest discover -s experiments/boundary-compensation -p 'test_*.py'
      - uses: actions/cache/restore@v5
        id: lean-cache
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/lean-toolchain') }}-${{ hashFiles('formal/lake-manifest.json') }}
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build-args: "--wfail SquarePackingArchive.QuadraticCertificateChecks"
          use-github-cache: "false"
      - name: Check exact-coordinate reconstruction recipes
        run: |
          python3 -S -m unittest discover -s ../scripts -p 'test_quadratic_tracker.py'
          python3 -S -m unittest discover -s ../scripts -p 'test_sqrt_seven_reconstruction.py'
      - name: Build certificates sequentially and check the complete library
        run: python3 -S ../scripts/build-lean-certificates.py
      - name: Test proof dependency policy
        run: python3 -S -m unittest discover -s ../scripts -p 'test_lean_axiom_policy.py'
      - name: Reject unfinished proofs
        run: |
          if grep -R --line-number --word-regexp sorry SquarePackingArchive SquarePackingArchive.lean; then
            exit 1
          fi
      - uses: actions/cache/save@v5
        if: steps.lean-cache.outputs.cache-hit != 'true'
        with:
          path: formal/.lake
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
